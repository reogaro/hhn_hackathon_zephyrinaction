set-name: 'PIC64GX-HSS::Accel11'

# Zephyr runs from cached DDR at 0x80000000.
# Cached DDR supports SMP hardware atomics (AMO/LR-SC via L2 cache).

# The payload tools replace the ELF path below with the current build path
# before calling the HSS payload generator.

# Note: the duplicate "secondary-hart" keys are intentional and required by the
# HSS payload generator. YAML linters flag them as duplicate map keys; ignore it.

hart-entry-points: {u54_1: '0x80000000', u54_2: '0x80000000', u54_3: '0x80000000', u54_4: '0x80000000'}

payloads:
  /sripiranavan/development/personal/hackathon/hhn_hackathon_zephyrinaction/examples/i2c-accel11/build/i2c/zephyr/zephyr.elf:
    exec-addr: '0x80000000'
    owner-hart: u54_1
    secondary-hart: u54_2
    secondary-hart: u54_3
    secondary-hart: u54_4
    priv-mode: prv_m
    skip-opensbi: true
    allow-reboot: cold
