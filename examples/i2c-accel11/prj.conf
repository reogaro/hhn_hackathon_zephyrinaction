# MikroElektronika Accel 11 Click (Bosch BMA456) over I2C on the mikroBUS header
# of the PIC64GX1000 Curiosity Kit.
#
# Deliberately minimal: no display, no LVGL, no sensor subsystem. Register
# access goes straight through the Zephyr I2C API, because the in-tree bma4xx
# driver rejects the BMA456 chip ID (0x16).

CONFIG_SMP=y
CONFIG_MP_MAX_NUM_CPUS=4

CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

CONFIG_I2C=y

CONFIG_MAIN_STACK_SIZE=4096

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

# Interactive bus poking: "i2c scan i2c@2010a000", "i2c read_byte ...".
# Useful when the Click board does not answer and you need to find out which
# controller is actually wired to the mikroBUS header in your FPGA design.
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_I2C_SHELL=y
CONFIG_KERNEL_SHELL=y


CONFIG_SCHED_THREAD_USAGE=y
CONFIG_THREAD_RUNTIME_STATS=y
