# GY-521 breakout (InvenSense MPU-6050, 6-axis accelerometer + gyro) over I2C on
# the mikroBUS header of the PIC64GX1000 Curiosity Kit.
#
# Deliberately minimal: no display, no LVGL, no sensor subsystem. Register
# access goes straight through the Zephyr I2C API.

CONFIG_SMP=y
CONFIG_MP_MAX_NUM_CPUS=4

CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

CONFIG_I2C=y

CONFIG_MAIN_STACK_SIZE=4096

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

# Interactive bus poking: "i2c read_byte ...".
# Useful when the sensor does not answer and you need to find out which
# controller is actually wired to the mikroBUS header in your FPGA design.
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_I2C_SHELL=y
CONFIG_KERNEL_SHELL=y

CONFIG_FPU=y
CONFIG_FPU_SHARING=y

